name: Backpressure comparison
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/compare_backpressure.py"
      - "compose.yaml"
      - ".github/workflows/backpressure-comparison.yml"
  push:
    paths:
      - "scripts/compare_backpressure.py"
      - "compose.yaml"
      - ".github/workflows/backpressure-comparison.yml"
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Start synthetic lab
        run: docker compose up --build -d
      - name: Run three baseline and three delayed repetitions
        run: python3 scripts/compare_backpressure.py --repetitions 3 --orders 15 --slow-delay 0.5
      - name: Upload measured reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backpressure-comparison-results
          path: artifacts/backpressure/
          if-no-files-found: warn
      - name: Logs on failure
        if: failure()
        run: docker compose ps && docker compose logs --no-color --tail=150
      - name: Stop lab
        if: always()
        run: docker compose down --remove-orphans
